user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    # Allow up to 210MB uploads (MinerU supports ≤200MB PDFs).
    client_max_body_size 210m;
    client_body_buffer_size 1m;
    proxy_request_buffering off;

    # Upstream services (resolved by docker compose service name)
    upstream backend_api {
        server backend:8000;
    }
    upstream frontend_app {
        server frontend:3000;
    }

    # Map to support both single-port (3500) and direct frontend (3000) modes.
    server {
        listen 3500;
        server_name _;

        # Long-poll friendly headers for streaming responses
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # Backend API
        location /api/ {
            # SSE: disable proxy buffering so events flush immediately.
            # These MUST be inside the location block — some nginx builds
            # do not reliably inherit proxy_buffering from the server
            # scope, which causes the whole chat stream to be held until
            # the response ends (so the UI only renders after `run_end`).
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            # Tell the upstream framework we're an SSE consumer.
            proxy_set_header Accept "text/event-stream";
            # Belt-and-braces: kill any downstream buffering too.
            add_header X-Accel-Buffering no always;
            proxy_pass http://backend_api;
        }
        location /health {
            proxy_pass http://backend_api/health;
        }
        location /docs {
            proxy_pass http://backend_api/docs;
        }
        location /openapi.json {
            proxy_pass http://backend_api/openapi.json;
        }
        location /redoc {
            proxy_pass http://backend_api/redoc;
        }

        # Frontend (Next.js standalone server)
        location / {
            proxy_pass http://frontend_app;
        }
    }

    # Public upload endpoint on a separate port. Only /api/attachments is
    # exposed here — every other path 404s — so an exposed 5050 on the
    # public Internet doesn't accidentally leak the rest of the API or
    # the web UI. Use this when you want a public-facing URL just for
    # file uploads (e.g. reverse-proxied via another host).
    server {
        listen 5050;
        server_name _;

        # Reuse the same upload size cap as the main server.
        client_max_body_size 210m;
        client_body_buffer_size 1m;
        proxy_request_buffering off;

        # Same headers as the main server so FastAPI/uvicorn treats the
        # request identically (real client IP, HTTP/1.1).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # Allow uploads + read-back of parsed attachments. The backend
        # blocks until MinerU finishes parsing (seconds-to-minutes for a
        # 200MB PDF) so we give the timeouts plenty of headroom.
        location /api/attachments {
            proxy_read_timeout 900s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 900s;
            proxy_pass http://backend_api;
        }

        # Anything else on 5050 → 404. Do NOT add a fallback location;
        # this is intentional so the port can't be used as a generic
        # backdoor into the rest of the API.
        location / {
            return 404;
        }
    }
}