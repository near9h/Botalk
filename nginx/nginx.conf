user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# SNI-style protocol sniffer: when a packet hits port 3500, the stream
# block below inspects the first byte — TLS handshake starts with 0x16
# (handshake), HTTP starts with a printable ASCII letter — and proxies
# to the matching `server` block inside the `http {}` section. Without
# this we can't bind 3500 to both HTTP and HTTPS at the same time.
stream {
    log_format stream_log '$remote_addr [$time_local] '
                          '$ssl_preread_protocol $ssl_preread_server_name '
                          '$status $bytes_sent $upstream_addr';
    access_log /var/log/nginx/stream.log stream_log;

    upstream http_backend {
        server 127.0.0.1:3501;
    }
    upstream https_backend {
        server 127.0.0.1:3502;
    }

    map $ssl_preread_protocol $backend {
        default http_backend;
        "TLSv1.2" https_backend;
        "TLSv1.3" https_backend;
    }

    server {
        listen 3500;
        proxy_pass $backend;
        ssl_preread on;
        # Plain TCP proxying would make the inner http server see
        # `$remote_addr = 127.0.0.1`, so audit logs would record the proxy
        # IP instead of the client's. Enable PROXY protocol to carry the
        # real client address across the hop. The inner listeners MUST also
        # be marked `proxy_protocol`, otherwise nginx answers 400 on the
        # unexpected PROXY header.
        proxy_protocol on;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    # Allow up to 210MB uploads (MinerU supports ≤200MB PDFs).
    client_max_body_size 210m;
    client_body_buffer_size 1m;
    proxy_request_buffering off;

    # Upstream services (resolved by docker compose service name)
    upstream backend_api {
        server backend:8000;
    }
    upstream frontend_app {
        server frontend:3000;
    }

    # Map to support both single-port (3500) and direct frontend (3000) modes.
    # `default_server` on the internal HTTP port; the `stream {}` block at
    # the top routes plain-HTTP traffic here from port 3500.
    server {
        # Matches `proxy_protocol on` in the stream block above; without it
        # nginx rejects the PROXY header with a 400.
        listen 127.0.0.1:3501 proxy_protocol default_server;
        server_name _;

        # Restore $remote_addr from the PROXY header, so the two headers
        # below carry the real client IP instead of 127.0.0.1.
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;

        # Long-poll friendly headers for streaming responses
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # Backend API
        location /api/ {
            # SSE: disable proxy buffering so events flush immediately.
            # These MUST be inside the location block — some nginx builds
            # do not reliably inherit proxy_buffering from the server
            # scope, which causes the whole chat stream to be held until
            # the response ends (so the UI only renders after `run_end`).
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            # nginx only inherits `proxy_set_header` from the server level
            # when the location declares NONE of its own. Setting `Accept`
            # here would therefore silently drop the client-IP headers
            # (audit logs then record the proxy's address), so they must be
            # repeated in every location that overrides any of them.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            # Tell the upstream framework we're an SSE consumer.
            proxy_set_header Accept "text/event-stream";
            # Belt-and-braces: kill any downstream buffering too.
            add_header X-Accel-Buffering no always;
            proxy_pass http://backend_api;
        }
        location /health {
            proxy_pass http://backend_api/health;
        }
        location /docs {
            proxy_pass http://backend_api/docs;
        }
        location /openapi.json {
            proxy_pass http://backend_api/openapi.json;
        }
        location /redoc {
            proxy_pass http://backend_api/redoc;
        }

        # Frontend (Next.js standalone server)
        location / {
            proxy_pass http://frontend_app;
        }
    }

    # HTTPS twin of the 3500 server above. Same proxy rules, just over TLS.
    # Listens on the same 3500 port as the HTTP server (nginx can serve
    # both protocols on one port; clients pick by scheme). Override via
    # NGINX_HTTPS_PORT if you need a separate port.
    # The self-signed cert (see nginx/Dockerfile) means browsers will
    # complain on first visit; the wire is encrypted end-to-end either way.
    server {
        # `ssl` + `proxy_protocol`: the PROXY header is read before the TLS
        # handshake, matching the stream block above.
        listen 127.0.0.1:3502 ssl proxy_protocol;
        http2 on;
        server_name _;

        # Same as 3501: restore the real client IP from the PROXY header.
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;

        ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Important: tell the upstream the original request was HTTPS so
        # FastAPI / the frontend can build correct absolute URLs.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # Backend API
        location /api/ {
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            # Same reason as the HTTP server above: declaring `Accept` here
            # cancels the inherited `proxy_set_header`s, so the client-IP
            # headers have to be repeated.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_set_header Accept "text/event-stream";
            add_header X-Accel-Buffering no always;
            proxy_pass http://backend_api;
        }
        location /health {
            proxy_pass http://backend_api/health;
        }
        location /docs {
            proxy_pass http://backend_api/docs;
        }
        location /openapi.json {
            proxy_pass http://backend_api/openapi.json;
        }
        location /redoc {
            proxy_pass http://backend_api/redoc;
        }

        # Frontend (Next.js standalone server)
        location / {
            proxy_pass http://frontend_app;
        }
    }

    # Public upload endpoint on a separate port. Only /api/attachments is
    # exposed here — every other path 404s — so an exposed 5050 on the
    # public Internet doesn't accidentally leak the rest of the API or
    # the web UI. Use this when you want a public-facing URL just for
    # file uploads (e.g. reverse-proxied via another host).
    server {
        listen 5050 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Reuse the same upload size cap as the main server.
        client_max_body_size 210m;
        client_body_buffer_size 1m;
        proxy_request_buffering off;

        # Same headers as the main server so FastAPI/uvicorn treats the
        # request identically (real client IP, HTTP/1.1).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # Allow uploads + read-back of parsed attachments. The backend
        # blocks until MinerU finishes parsing (seconds-to-minutes for a
        # 200MB PDF) so we give the timeouts plenty of headroom.
        location /api/attachments {
            proxy_read_timeout 900s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 900s;
            proxy_pass http://backend_api;
        }

        # Anything else on 5050 → 404. Do NOT add a fallback location;
        # this is intentional so the port can't be used as a generic
        # backdoor into the rest of the API.
        location / {
            return 404;
        }
    }
}