[project]
name = "botgroup-backend"
version = "0.1.0"
description = "Multi-bot group chat backend (FastAPI + openai SDK + PostgreSQL)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.54",
    "sse-starlette>=2.1",
    "httpx>=0.28",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "python-docx>=1.1",  # parses .docx templates into structured markdown
    "pypandoc-binary>=1.13",  # in-tree pandoc binary (no system pandoc required)
    "jinja2>=3.1",  # structured-payload → HTML/docx rendering (路线 B)
    "markdown-it-py>=3.0",  # safe markdown→html for template body (html:false)
    "slowapi>=0.1.9",  # rate limiting (security audit item A2)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
# CI-only deps. Production keeps installing the slim `dependencies` list.
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]