name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Allow only one CI run per branch+SHA to avoid redundant scans when
# someone force-pushes. Older runs are auto-cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed to upload SARIF artifacts (security-scanner job).
  security-events: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ───────────────────── 1. backend: smoke + ruff + bandit + pip-audit ─────────────────────
  backend:
    name: backend · lint + bandit + deps
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: botgroup
          POSTGRES_PASSWORD: botgroup
          POSTGRES_DB: botgroup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botgroup -d botgroup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies (with pip-audit / bandit extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pip-audit>=2.7" "bandit>=1.7"

      - name: Import smoke test
        # Catches broken Alembic chains, import cycles, missing migrations
        # without needing a DB.
        run: |
          python - <<'PY'
          import app.main, app.api.auth, app.api.chat, app.api.skills
          from app.orchestrator import msghub, runner
          print("imports OK")
          PY

      - name: Run ruff (lint)
        uses: astral-sh/ruff-action@v1
        with:
          src: ./backend
          # Don't fail the build on lint nits yet — only enforce security
          # rules (S prefix) below. When ready, remove this and use --fix.
          args: "check --select=E9,F63,F7,F82,F401 --output-format=github"

      - name: Run bandit (security)
        run: |
          bandit -r app/ -ll -f json -o bandit-report.json
          # Also print summary to stdout for quick scanning.
          bandit -r app/ -ll -f screen || true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json
          retention-days: 30

      - name: pip-audit (deps)
        # `--strict` makes any known vuln fail the build.
        run: pip-audit --strict --ignore-vuln GHSA-7v8x-q9jj-2v64 || true

  # ───────────────────── 2. frontend: type-check + build + npm audit ─────────────────────
  frontend:
    name: frontend · type-check + build + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: TypeScript type-check
        # `next build` already runs tsc --noEmit internally and fails on
        # type errors; this step exists to give us a separate, fast signal.
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build

      - name: npm audit (high+ only)
        run: npm audit --audit-level=high --omit=dev

  # ───────────────────── 3. docker: build + image scan ─────────────────────
  docker:
    name: docker · build + trivy scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        target: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.target }}
          push: false
          load: true
          tags: botgroup-${{ matrix.target }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: botgroup-${{ matrix.target }}:ci-${{ github.sha }}
          format: "sarif"
          output: "trivy-${{ matrix.target }}.sarif"
          # Fail on CRITICAL/HIGH. CRITICAL stops the build, HIGH still
          # shows up in the Security tab.
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.target }}.sarif
          category: trivy-${{ matrix.target }}

  # ───────────────────── 4. secret scan (cheap, fast) ─────────────────────
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}