# RAGFlow stack — knowledge base engine for the 路线 RAG pipeline.
#
# This file is *not* loaded by the main `docker compose up` — it's a
# side-car the operator opts into via:
#
#   docker compose -f docker-compose.yml -f infra/docker-compose.ragflow.yml up -d
#
# Why side-car (not inlined)?
#   - RAGFlow needs ≥4C8G to start (Elasticsearch is greedy). Many
#     dev/CI machines can't afford that. Keeping it opt-in avoids a
#     regression where `docker compose up` suddenly fails because the
#     host is under-resourced.
#   - Operators who deploy BotGroup on a small VM can still run the rest
#     of the stack without RAG (the orchestrator falls back gracefully
#     when RAGFLOW_BASE_URL is empty).
#
# Image source: https://github.com/infiniflow/ragflow (Apache 2.0)
# We pin to a specific slim image (CPU-only) to keep the image ~3 GB
# instead of the full-fat ~6 GB GPU variant. To run on GPU, swap the
# `image` line for `infiniflow/ragflow:nightly` and add the deploy
# resources stanza commented below.

services:
  ragflow:
    # Slim CPU-only image. Override RAGFLOW_IMAGE to swap to a GPU
    # build (e.g. `infiniflow/ragflow:v0.27.2`).
    image: ${RAGFLOW_IMAGE:-infiniflow/ragflow:v0.27.2-slim}
    container_name: botgroup-ragflow
    restart: unless-stopped
    # RAGFlow persists its data inside `/var/lib/ragflow` (datasets,
    # uploaded files, parsed chunks). Mounting a host volume keeps
    # that across `docker compose down` cycles.
    volumes:
      - ./data/ragflow:/var/lib/ragflow
    # The exposed port is 9380 (HTTP API) and 9222 (admin UI). On the
    # host we only expose 9380 — operators who want the admin UI can
    # either uncomment the second port or hit it from inside the
    # network.
    ports:
      - "${RAGFLOW_PORT:-9380}:9380"
    # RAGFlow needs the kernel mmap count raised for Elasticsearch.
    # If your host doesn't have it set, the container will still boot
    # but ES will log warnings and may crash under load.
    privileged: false
    # Healthcheck hits the API root which returns `{code: 0}` when
    # the server is up.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9380/api/v1/system/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    # Elasticsearch inside RAGFlow needs at least 262144 mmap pages.
    # On the host: `sudo sysctl -w vm.max_map_count=262144` (one-shot).
    environment:
      # Use 80% of the host memory for ES heap by default; override
      # via env var when the host has less than 8 GB free.
      ES_JAVA_OPTS: ${RAGFLOW_ES_JAVA_OPTS:-"-Xms2g -Xmx2g"}
      TZ: ${TZ:-Asia/Shanghai}
      # RAGFlow v0.27+ uses its own MySQL/ES/Redis/MinIO baked into
      # the image, so we don't need to declare them here. Operators
      # who want to swap to external services can override the envs
      # listed in https://ragflow.io/docs/dev/.

  # ─────────────────────── side-cars ───────────────────────
  # The two services below let BotGroup (running on the same host but
  # *outside* this docker compose) reach RAGFlow over a known name.
  # We don't need them if you're already on the `botgroup-net` network
  # defined in the main compose file — just uncomment the `networks`
  # stanza on `ragflow` and remove this section.

  # ragflow-alias:
  #   image: alpine:3
  #   networks: [botgroup-net]
  #   entrypoint: ["sleep", "infinity"]

networks:
  default:
    name: botgroup-ragflow-net
    driver: bridge

# Optional GPU override. Uncomment + set `RAGFLOW_IMAGE=infiniflow/ragflow:v0.27.2`
# (the full-fat variant) to enable DeepDoc's VLM features.
#   deploy:
#     resources:
#       reservations:
#         devices:
#           - driver: nvidia
#             count: 1
#             capabilities: [gpu]